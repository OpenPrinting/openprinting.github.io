name: Deploy Next.js site to Pages

on:
  push:
    branches: [master]

  # Weekly rebuild so recommendations pick up upstream foomatic-db changes.
  schedule:
    - cron: "0 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install --immutable" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Enable Corepack after setup-node so the Yarn 4 shim attaches to the
      # active Node. setup-node's `cache: yarn` is omitted because its
      # `yarn cache dir` probe runs Yarn 1 and aborts on the packageManager pin.
      - name: Enable Corepack
        run: corepack enable
      - name: Install Foomatic system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            foomatic-db-engine \
            foomatic-db-compressed-ppds \
            cups-filters \
            ghostscript \
            bsdmainutils \
            libxml2-utils \
            xsltproc \
            python3 \
            python3-pip
      # Do NOT set `static_site_generator: next` here: it makes configure-pages
      # write a `next.config.js`, which Next.js prefers over this repo's
      # `next.config.ts`, so the deployed build silently ignores our config
      # (#207). Everything it would inject is already in `next.config.ts`.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} build
      # Blocks the deploy on broken URLs (#207); reads ./out, rebuilds nothing.
      - name: Verify URL conventions
        run: ${{ steps.detect-package-manager.outputs.runner }} verify:urls
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
